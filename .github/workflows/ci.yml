name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Git feature
        run: git --no-lazy-fetch --version
      - name: Test index and failure behavior
        run: python -B -m unittest discover -s tests -v
      - name: Install and check entry points
        run: |
          python -m pip install .
          check-secrets --version
          python -m check_secrets --version
      - name: Scan complete checkout index
        run: check-secrets --all

  package-and-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build and inspect distributions
        run: |
          python -m pip install build twine pre-commit
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
          check-secrets --all
      - name: Validate pre-commit manifest and configuration
        run: |
          pre-commit validate-manifest .pre-commit-hooks.yaml
          pre-commit validate-config .pre-commit-config.yaml
      - name: Exercise installed Python hook in a temporary repository
        run: python tests/check_pre_commit.py
